<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario — Supabase</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Gestión de Inventario</h1>
    <span id="estado" class="estado">Conectando…</span>
  </header>

  <main>
    <section class="card">
      <h2>Agregar producto</h2>
      <form id="formProducto">
        <input type="text"   id="nombre"    placeholder="Nombre"    required>
        <input type="text"   id="categoria" placeholder="Categoría" required>
        <input type="number" id="cantidad"  placeholder="Cantidad"  required min="0">
        <input type="number" id="precio"    placeholder="Precio"    required min="0" step="0.01">
        <input type="number" id="minimo"    placeholder="Stock mínimo" required min="0">
        <button type="submit">Guardar</button>
      </form>
    </section>

    <section class="card">
      <h2>Productos registrados</h2>
      <table id="tablaProductos">
        <thead>
          <tr>
            <th>ID</th><th>Nombre</th><th>Categoría</th>
            <th>Cantidad</th><th>Precio</th><th>Mínimo</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- 1) El CDN de Supabase SIEMPRE antes de app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2) Tu código después -->
  <script src="app.js"></script>
</body>
</html>
